name: 'Terraform'

on: [push, pull_request]

env:
  TF_LOG: INFO
  TF_INPUT: false

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest

    # Use the Bash shell regardless whether the GitHub Actions runner is
    # ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout
        uses: actions/checkout@v4

      # Install the preferred version of Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
      - name: Terraform Init
        id: init
        run: terraform init

      # Run a terraform fmt for push
      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive

      # Run a terraform validate
      # Run even if formatting fails
      - name: Terraform Validate
        id: validate
        if: (success() || failure())
        run: terraform validate

      - name: Terraform Test
        if: (success() || failure())
        run: terraform test

      - name: Install falco
        if: (success() || failure())
        run: curl -sSL https://github.com/ysugimoto/falco/releases/download/v2.3.0/falco-linux-amd64.tar.gz | sudo tar xz -C /usr/local/bin

      - name: VCL Lint
        if: (success() || failure())
        run: falco lint vcl/main.vcl

      - name: VCL Test
        if: (success() || failure())
        run: falco test -I vcl/tests vcl/main.vcl
